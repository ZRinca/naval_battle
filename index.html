<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f0dd">
<title>Морской бой</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --cell: clamp(24px, 3.2vw, 38px);

    --paper-bg: #f6f0dd;
    --paper-board: #fdf9ea;
    --paper-input: #fbf6e6;
    --grid-line: rgba(70, 120, 170, 0.42);
    --grid-frame: #3a5a85;
    --ink: #1a3a5c;
    --ink-soft: #4a6a8c;
    --ink-faded: #8a9cb4;

    --ship4-c1: #e09088; --ship4-c2: #c85048; --ship4-c3: #8a2e28;
    --ship3-c1: #e8b878; --ship3-c2: #d09030; --ship3-c3: #90581a;
    --ship2-c1: #90c8a0; --ship2-c2: #4a8a5a; --ship2-c3: #2a5a3a;
    --ship1-c1: #88b0e0; --ship1-c2: #3a70b0; --ship1-c3: #1a4a80;

    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }

  html, body { height: 100%; margin: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: calc(8px + var(--safe-top)) calc(10px + var(--safe-right))
             calc(10px + var(--safe-bottom)) calc(10px + var(--safe-left));
    font-family: 'Courier New', Courier, 'Lucida Console', monospace;
    color: var(--ink);
    background-color: var(--paper-bg);
    background-image:
      linear-gradient(rgba(70, 120, 170, 0.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(70, 120, 170, 0.16) 1px, transparent 1px);
    background-size: 22px 22px;
    background-attachment: fixed;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at 50% 40%, transparent 55%, rgba(80, 90, 110, 0.06) 100%);
    z-index: 0;
  }

  .game {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1400px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    overflow: hidden;
  }

  .main-title {
    margin: 0;
    text-align: center;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(16px, 2.4vw, 24px);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.1;
    padding-bottom: 2px;
    border-bottom: 2px solid var(--ink);
    display: inline-block;
    flex: 0 0 auto;
  }

  .boards {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: clamp(14px, 2.4vw, 36px);
    flex-wrap: nowrap;
    flex: 0 1 auto;
    min-height: 0;
    transition: gap .3s ease;
  }

  .board-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 0 0 auto;
  }

  .board-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink);
    font-weight: 700;
    text-align: center;
    white-space: nowrap;
    line-height: 1.15;
    min-height: 12px;
    padding-bottom: 1px;
    border-bottom: 1px dashed var(--ink-faded);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(10, var(--cell));
    grid-template-rows: repeat(10, var(--cell));
    gap: 0;
    padding: 0;
    border: 2px solid var(--grid-frame);
    background: var(--paper-board);
    box-shadow:
      4px 4px 0 rgba(60, 100, 160, 0.14),
      inset 0 0 0 1px rgba(255, 255, 255, 0.55);
    touch-action: manipulation;
    transition:
      grid-template-columns .35s ease,
      grid-template-rows .35s ease;
  }

  .cell {
    position: relative;
    background: transparent;
    border-right: 1px solid var(--grid-line);
    border-bottom: 1px solid var(--grid-line);
    cursor: pointer;
    transition: background .1s ease;
  }

  .grid .cell:nth-child(10n) { border-right: none; }
  .grid .cell:nth-last-child(-n+10) { border-bottom: none; }

  .grid.enemy-active .cell:not(.shot):active { background: rgba(120, 170, 220, 0.35); }
  .grid.place-active .cell:not(.ship):active { background: rgba(140, 180, 220, 0.28); }

  @media (hover: hover) and (pointer: fine) {
    .grid.enemy-active .cell:not(.shot):hover { background: rgba(120, 170, 220, 0.3); }
    .grid.place-active .cell:not(.ship):hover { background: rgba(140, 180, 220, 0.25); }
  }

  .cell.ship-size-1 { --c1: var(--ship1-c1); --c2: var(--ship1-c2); --c3: var(--ship1-c3); }
  .cell.ship-size-2 { --c1: var(--ship2-c1); --c2: var(--ship2-c2); --c3: var(--ship2-c3); }
  .cell.ship-size-3 { --c1: var(--ship3-c1); --c2: var(--ship3-c2); --c3: var(--ship3-c3); }
  .cell.ship-size-4 { --c1: var(--ship4-c1); --c2: var(--ship4-c2); --c3: var(--ship4-c3); }

  .cell.ship {
    background: linear-gradient(180deg, var(--c1) 0%, var(--c2) 50%, var(--c3) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.4),
      inset 0 -1px 0 rgba(0, 0, 0, 0.22),
      inset 0 0 0 1px rgba(255, 255, 255, 0.18);
  }

  .cell.miss::after,
  .cell.auto::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    width: 30%; height: 30%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: var(--ink-soft);
  }
  .cell.auto::after { background: var(--ink-faded); opacity: 0.75; }

  .cell.hit {
    background: linear-gradient(180deg, #f07060 0%, #c83030 50%, #8a1818 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), inset 0 -1px 0 rgba(0, 0, 0, 0.25);
  }

  .cell.sunk {
    background: linear-gradient(180deg, #6a2828 0%, #4a1010 50%, #2a0808 100%);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35), inset 0 0 12px rgba(0, 0, 0, 0.5);
  }

  .cell.hit::after,
  .cell.sunk::after {
    content: '✕';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    font-size: calc(var(--cell) * 0.72);
    font-weight: 900;
    line-height: 1;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }
  .cell.sunk::after { color: rgba(255, 190, 180, 0.5); text-shadow: none; }

  .cell.scouted { background: rgba(255, 220, 110, 0.28); }

  .cell.scouted::before {
    content: '';
    position: absolute;
    inset: 16%;
    border: 2px solid #c89020;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.6);
    animation: scoutPulse 1.4s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes scoutPulse {
    0%, 100% { opacity: 1; transform: scale(0.75); }
    50%      { opacity: 0.4; transform: scale(1.1); }
  }

  .cell.preview-ok {
    background: linear-gradient(180deg, rgba(120, 210, 140, 0.9) 0%, rgba(60, 160, 100, 0.95) 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.55);
  }
  .cell.preview-bad {
    background: linear-gradient(180deg, rgba(240, 130, 130, 0.9) 0%, rgba(200, 70, 70, 0.95) 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5);
  }

  .status {
    min-height: 24px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-align: center;
    padding: 3px 14px;
    border: 1px dashed var(--ink-faded);
    background: rgba(255, 255, 255, 0.45);
    border-radius: 3px;
    color: var(--ink);
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.25;
    flex: 0 0 auto;
  }

  .status.you   { color: #1a6a2a; background: rgba(150, 220, 170, 0.4); border-color: #3a8a5a; }
  .status.enemy { color: #8a2a1a; background: rgba(240, 190, 170, 0.4); border-color: #a04030; }
  .status.win   { color: #145a20; background: rgba(150, 220, 170, 0.55); border-color: #3a8a5a; border-style: solid; }
  .status.lose  { color: #7a1e10; background: rgba(240, 180, 160, 0.55); border-color: #a04030; border-style: solid; }
  .status.scout { color: #6a4818; background: rgba(255, 230, 140, 0.55); border-color: #b09030; }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    width: 100%;
    flex: 0 0 auto;
  }

  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    width: 100%;
  }

  .panel.hidden { display: none; }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .placement-info {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: nowrap;
    padding: 3px 10px;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid var(--grid-line);
    border-radius: 4px;
  }

  .placement-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    min-width: 66px;
  }

  .placement-step .label {
    font-family: Georgia, serif;
    font-size: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 700;
    line-height: 1;
  }

  .placement-step .value {
    font-size: 12px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.15;
    white-space: nowrap;
  }

  .orientation-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border: 1px solid #406090;
    border-radius: 3px;
    background: #dce8f0;
    color: var(--ink);
    font-weight: 800;
    font-size: 11px;
    letter-spacing: 0.4px;
    box-shadow: 2px 2px 0 rgba(60, 100, 160, 0.15);
    line-height: 1.1;
    white-space: nowrap;
  }

  .orientation-badge .arrow {
    font-size: 13px;
    display: inline-block;
    transition: transform .25s ease;
  }
  .orientation-badge.vertical .arrow { transform: rotate(90deg); }

  .fleet-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    min-height: 16px;
  }

  .chip {
    display: flex;
    gap: 1px;
    padding: 1px;
    border: 1px solid var(--grid-line);
    background: rgba(255, 255, 255, 0.55);
    border-radius: 2px;
    transition: all .15s;
  }

  .chip .blk {
    width: 7px; height: 7px;
    background: #b8b0a0;
    border-radius: 1px;
  }

  .chip.chip-size-1 .blk { background: var(--ship1-c2); border-radius: 50%; }
  .chip.chip-size-2 .blk { background: var(--ship2-c2); }
  .chip.chip-size-3 .blk { background: var(--ship3-c2); }
  .chip.chip-size-4 .blk { background: var(--ship4-c2); }

  .chip.active {
    border-color: var(--grid-frame);
    border-width: 2px;
    background: #e0e8f0;
    animation: chipPulse 1.6s ease-in-out infinite;
  }

  @keyframes chipPulse {
    0%, 100% { box-shadow: 0 0 0 rgba(60, 100, 160, 0); }
    50%      { box-shadow: 0 0 8px rgba(60, 100, 160, 0.5); }
  }

  .chip.done { opacity: .28; }

  .action-bar {
    display: flex;
    gap: 6px;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: center;
    padding: 5px 8px;
    background: rgba(255, 255, 255, 0.6);
    border: 2px solid var(--grid-frame);
    border-radius: 5px;
    box-shadow:
      2px 2px 0 rgba(60, 100, 160, 0.16),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
  }

  .btns-bottom {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    min-height: 34px;
  }

  button {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.4px;
    padding: 7px 14px;
    border: 2px solid var(--grid-frame);
    background: var(--paper-input);
    color: var(--ink);
    cursor: pointer;
    transition: all .12s;
    min-height: 34px;
    touch-action: manipulation;
    line-height: 1.1;
    border-radius: 3px;
    box-shadow:
      2px 2px 0 rgba(60, 100, 160, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
    white-space: nowrap;
    text-transform: uppercase;
  }

  button:active {
    transform: translate(2px, 2px);
    box-shadow:
      0 0 0 rgba(60, 100, 160, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
    background: #f0e8ce;
  }

  @media (hover: hover) and (pointer: fine) {
    button:hover {
      background: #fffdf5;
      box-shadow:
        3px 3px 0 rgba(60, 100, 160, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }
  }

  #rotateBtn {
    background: linear-gradient(180deg, #d8e8f4 0%, #b8d0e8 100%);
    border-color: #2a4a70;
    color: #0a2a50;
    min-width: 118px;
    font-size: 12.5px;
  }
  #rotateBtn:hover { background: linear-gradient(180deg, #e4eef8 0%, #c4d8ec 100%); }

  #randomBtn {
    background: linear-gradient(180deg, #d8ecd8 0%, #b4d8b4 100%);
    border-color: #2a6030;
    color: #0a4018;
    min-width: 110px;
    font-size: 12.5px;
  }
  #randomBtn:hover { background: linear-gradient(180deg, #e4f4e4 0%, #c4e0c4 100%); }

  #clearBtn {
    background: linear-gradient(180deg, #f4dcd8 0%, #e8b8b0 100%);
    border-color: #803020;
    color: #601810;
    min-width: 105px;
    font-size: 12.5px;
  }
  #clearBtn:hover { background: linear-gradient(180deg, #f8e4e0 0%, #ecc4bc 100%); }

  #scoutBtn {
    background: linear-gradient(180deg, #ffe8a8 0%, #f0c860 100%);
    border-color: #8a6018;
    color: #5a3808;
    box-shadow:
      2px 2px 0 rgba(140, 100, 40, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
    animation: scoutGlow 2s ease-in-out infinite;
    min-width: 200px;
    text-align: center;
    font-size: 12px;
  }

  @keyframes scoutGlow {
    0%, 100% {
      box-shadow:
        2px 2px 0 rgba(140, 100, 40, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        0 0 0 rgba(200, 160, 60, 0);
    }
    50% {
      box-shadow:
        2px 2px 0 rgba(140, 100, 40, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        0 0 18px rgba(200, 160, 60, 0.7);
    }
  }

  #scoutBtn:hover { background: linear-gradient(180deg, #fff0b8 0%, #f4d070 100%); }

  #scoutBtn.cooldown {
    background: #d8d0b0;
    border-color: #8a8068;
    color: #6a6458;
    cursor: wait;
    animation: none;
    opacity: 0.75;
    box-shadow: 1px 1px 0 rgba(60, 100, 160, 0.15);
  }
  #scoutBtn.cooldown:hover { transform: none; background: #d8d0b0; }

  #newGameBtn {
    background: linear-gradient(180deg, #e8e0d0 0%, #d0c8b0 100%);
    border-color: #6a5a40;
    color: #3a2a10;
    min-width: 110px;
    font-size: 12px;
  }
  #newGameBtn:hover { background: linear-gradient(180deg, #f0e8dc 0%, #d8d0bc 100%); }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(240, 232, 205, 0.92);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 100;
    padding: calc(20px + var(--safe-top)) calc(16px + var(--safe-right))
             calc(20px + var(--safe-bottom)) calc(16px + var(--safe-left));
    touch-action: none;
  }

  .overlay.hidden { display: none; }

  .overlay-box {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
    text-align: center;
    max-width: 400px;
    width: 100%;
    padding: 32px 26px;
    border: 2px solid var(--grid-frame);
    border-radius: 4px;
    background: var(--paper-board);
    box-shadow:
      8px 8px 0 rgba(60, 100, 160, 0.2),
      inset 0 0 0 1px rgba(255, 255, 255, 0.6);
    animation: pop .25s ease;
    position: relative;
  }

  .overlay-box::before {
    content: '';
    position: absolute;
    inset: -6px;
    border: 1px dashed var(--ink-faded);
    border-radius: 6px;
    pointer-events: none;
    z-index: -1;
    transform: rotate(-0.6deg);
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(.94) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .overlay-box h1 {
    margin: 0 0 6px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(22px, 5.5vw, 28px);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.15;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--ink);
  }

  .overlay-box h2 {
    margin: 0;
    font-family: Georgia, serif;
    font-size: clamp(18px, 4.5vw, 22px);
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink);
    line-height: 1.2;
  }

  .overlay-box p {
    margin: 0;
    font-family: Georgia, serif;
    color: var(--ink-soft);
    font-size: 13.5px;
    line-height: 1.55;
    font-style: italic;
  }

  .menu-btn {
    width: 100%;
    padding: 14px 16px;
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: 0.6px;
    border-radius: 3px;
    min-height: 52px;
    white-space: normal;
    line-height: 1.3;
  }

  .menu-btn .sub {
    display: block;
    font-family: Georgia, serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.4px;
    opacity: 0.7;
    margin-top: 3px;
    text-transform: none;
    font-style: italic;
  }

  .menu-btn.bot { background: #dce8f0; border-color: #406090; color: var(--ink); }
  .menu-btn.duo { background: #f0e0c8; border-color: #906830; color: #5a3818; }

  .overlay-box .icon {
    font-size: 44px;
    line-height: 1;
    margin-bottom: 4px;
    filter: drop-shadow(2px 2px 0 rgba(60, 100, 160, 0.2));
  }

  @media (min-aspect-ratio: 16/10) and (min-height: 450px) {
    :root { --cell: min(4.8vh, 3vw, 50px); }

    body { padding: 6px 10px; }
    .game { gap: 4px; }

    .main-title {
      font-size: clamp(13px, 1.1vw, 20px);
      letter-spacing: 2px;
      padding-bottom: 1px;
      border-bottom-width: 1px;
    }

    .boards { gap: clamp(14px, 2vw, 32px); }
    .board-wrap { gap: 3px; }
    .board-title {
      font-size: 9px;
      letter-spacing: 1px;
      min-height: 11px;
      padding-bottom: 0;
    }

    .status {
      min-height: 20px;
      font-size: 11px;
      padding: 2px 12px;
      letter-spacing: 0.5px;
    }

    .controls { gap: 3px; }
    .panel { gap: 3px; }

    .top-row { gap: 8px; }

    .placement-info { padding: 2px 8px; gap: 8px; }
    .placement-step { min-width: 56px; }
    .placement-step .label { font-size: 7px; letter-spacing: 0.8px; }
    .placement-step .value { font-size: 10px; }
    .orientation-badge { padding: 2px 7px; font-size: 10px; }
    .orientation-badge .arrow { font-size: 11px; }

    .hint { display: none; }

    .fleet-list { gap: 3px; min-height: 14px; }
    .chip { padding: 1px; }
    .chip .blk { width: 6px; height: 6px; }

    .action-bar {
      padding: 4px 8px;
      gap: 6px;
      border-width: 2px;
      box-shadow:
        2px 2px 0 rgba(60, 100, 160, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    button {
      padding: 6px 12px;
      font-size: 11px;
      min-height: 30px;
      border-width: 2px;
      box-shadow:
        2px 2px 0 rgba(60, 100, 160, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    #rotateBtn { min-width: 100px; font-size: 11.5px; }
    #randomBtn { min-width: 95px; font-size: 11.5px; }
    #clearBtn { min-width: 90px; font-size: 11.5px; }

    .btns-bottom { gap: 6px; min-height: 30px; }

    #newGameBtn { min-width: 100px; font-size: 11px; padding: 6px 12px; min-height: 30px; }
  }

  @media (min-aspect-ratio: 16/10) and (max-height: 620px) {
    .main-title { display: none; }
  }

  @media (min-aspect-ratio: 21/10) and (min-height: 450px) {
    :root { --cell: min(4.9vh, 2.8vw, 54px); }
  }

  @media (min-aspect-ratio: 16/10) and (min-height: 450px) {
    body.battle-mode { --cell: min(6.8vh, 4.2vw, 72px); }

    body.battle-mode .boards { gap: clamp(18px, 2.6vw, 44px); }
    body.battle-mode .board-title { font-size: 11px; letter-spacing: 1.4px; }
  }

  @media (min-aspect-ratio: 21/10) and (min-height: 450px) {
    body.battle-mode { --cell: min(7vh, 3.6vw, 78px); }
  }

  @media (min-aspect-ratio: 16/10) and (max-height: 700px) {
    body.battle-mode { --cell: min(6.4vh, 4vw, 64px); }
  }

  @media (min-aspect-ratio: 16/10) and (max-height: 560px) {
    body.battle-mode { --cell: min(6vh, 4vw, 56px); }
  }

  @media (max-aspect-ratio: 4/3) {
    :root { --cell: min(8vw, 8vh, 40px); }
    .game { gap: 8px; }
    .boards { flex-direction: column; align-items: center; gap: 10px; flex-wrap: wrap; }
    .main-title { letter-spacing: 2px; }
    .placement-info { gap: 8px; padding: 4px 10px; }
    .placement-step { min-width: 70px; }
    .placement-step .label { font-size: 8.5px; }
    .placement-step .value { font-size: 12.5px; }
    .orientation-badge { font-size: 12px; padding: 4px 10px; }

    .action-bar { gap: 8px; padding: 6px 10px; flex-wrap: wrap; }

    button { font-size: 12.5px; padding: 9px 14px; min-height: 40px; }
    #rotateBtn { min-width: 110px; }
    #randomBtn { min-width: 105px; }
    #clearBtn { min-width: 100px; }
    #scoutBtn { min-width: 200px; font-size: 12px; }
    #newGameBtn { min-width: 110px; }

    body.battle-mode { --cell: min(11vw, 9vh, 56px); }
  }

  @media (max-width: 480px) {
    :root { --cell: min(8.8vw, 8.8vh, 36px); }
    body { padding: calc(8px + var(--safe-top)) calc(6px + var(--safe-right))
                  calc(10px + var(--safe-bottom)) calc(6px + var(--safe-left)); }
    .main-title { font-size: 18px; }
    .overlay-box { padding: 24px 18px; }
    .hint { font-size: 10.5px; }

    .action-bar { gap: 5px; padding: 6px 8px; }
    button { font-size: 11.5px; padding: 8px 10px; min-height: 38px; }
    #rotateBtn { min-width: 95px; }
    #randomBtn { min-width: 90px; }
    #clearBtn { min-width: 85px; }
    #scoutBtn { min-width: 170px; font-size: 11.5px; }
    #newGameBtn { min-width: 95px; }

    body.battle-mode { --cell: min(11.5vw, 9.5vh, 52px); }
  }

  @media (max-height: 520px) and (orientation: landscape) {
    :root { --cell: min(6.2vh, 6vw, 34px); }
    body { padding: 4px 8px; }
    .main-title { display: none; }
    .game { gap: 3px; }
    .boards { gap: 12px; }
    .board-title { font-size: 8px; letter-spacing: 0.8px; min-height: 10px; }
    .status { font-size: 10.5px; padding: 2px 10px; min-height: 18px; }
    .controls { gap: 3px; }
    .panel { gap: 3px; }
    .placement-info { padding: 2px 8px; gap: 8px; }
    .placement-step { min-width: 52px; }
    .placement-step .label { font-size: 7px; }
    .placement-step .value { font-size: 10px; }
    .orientation-badge { padding: 2px 7px; font-size: 10px; }
    .orientation-badge .arrow { font-size: 11px; }
    .hint { display: none; }

    .action-bar { padding: 4px 8px; gap: 6px; }
    button { font-size: 10.5px; padding: 5px 10px; min-height: 28px; border-width: 2px; }
    #rotateBtn { min-width: 92px; }
    #randomBtn { min-width: 88px; }
    #clearBtn { min-width: 82px; }
    #scoutBtn { min-width: 170px; font-size: 10.5px; }
    #newGameBtn { min-width: 92px; }

    body.battle-mode { --cell: min(7.8vh, 7vw, 46px); }
  }

  .grid, .cell {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
</style>

<body>
<div class="game">
  <h1 class="main-title" data-i18n="title">Морской бой</h1>

  <div class="boards">
    <div class="board-wrap">
      <div class="board-title" id="leftTitle">Ваш флот</div>
      <div class="grid" id="playerGrid"></div>
    </div>

    <div class="board-wrap">
      <div class="board-title" id="rightTitle">Флот противника</div>
      <div class="grid" id="enemyGrid"></div>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div class="controls">
    <div class="panel" id="placementPanel">
      <div class="top-row">
        <div class="placement-info">
          <div class="placement-step">
            <span class="label" data-i18n="shipLabel">Корабль</span>
            <span class="value" id="shipSizeLabel">Линкор</span>
          </div>

          <div class="orientation-badge" id="orientationBadge">
            <span class="arrow" id="orientationArrow">→</span>
            <span id="orientationText" data-i18n="horizontal">Горизонтально</span>
          </div>

          <div class="placement-step">
            <span class="label" data-i18n="leftLabel">Осталось</span>
            <span class="value" id="shipsLeftLabel">10</span>
          </div>
        </div>

        <div class="fleet-list" id="fleetList"></div>
      </div>

      <div class="hint" data-i18n-html="placeHint">
        <b>Тапните по своему полю</b> — корабль встанет в эту клетку.
      </div>

      <div class="action-bar">
        <button id="rotateBtn" data-i18n="rotate">⟳ Повернуть</button>
        <button id="randomBtn" data-i18n="random">🎲 Случайно</button>
        <button id="clearBtn" data-i18n="clear">✕ Очистить</button>
      </div>
    </div>

    <div class="btns-bottom">
      <button id="scoutBtn" style="display:none" data-i18n="scout">📺 Разведка</button>
      <button id="newGameBtn" data-i18n="backToMenu">← В меню</button>
    </div>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="overlay-box">
    <div class="icon">⚓</div>
    <h1 data-i18n="title">Морской бой</h1>
    <button class="menu-btn bot" id="menuBot">
      <span data-i18n="menuBot">🤖 Игра с ботом</span>
      <span class="sub" data-i18n="menuBotSub">Против компьютера</span>
    </button>
    <button class="menu-btn duo" id="menuDuo">
      <span data-i18n="menuDuo">👥 Игра на двоих</span>
      <span class="sub" data-i18n="menuDuoSub">По очереди на одном устройстве</span>
    </button>
  </div>
</div>

<div class="overlay hidden" id="pass">
  <div class="overlay-box">
    <div class="icon">🎮</div>
    <h2 id="passTitle">Игрок 2</h2>
    <p id="passText">Передайте устройство другому игроку</p>
    <button class="menu-btn" id="passBtn" data-i18n="ready">Готов</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  const TRANSLATIONS = {
    ru: {
      title: 'Морской бой',
      menuBot: '🤖 Игра с ботом', menuBotSub: 'Против компьютера',
      menuDuo: '👥 Игра на двоих', menuDuoSub: 'По очереди на одном устройстве',
      shipLabel: 'Корабль', leftLabel: 'Осталось',
      horizontal: 'Горизонтально', vertical: 'Вертикально',
      ship4: 'Линкор', ship3: 'Крейсер', ship2: 'Эсминец', ship1: 'Катер',
      rotate: '⟳ Повернуть', random: '🎲 Случайно', clear: '✕ Очистить',
      backToMenu: '← В меню',
      scout: '📺 Разведка', scoutCooling: '⏳ {n}с', scoutLoading: '⏳ ...',
      scoutFound: '🎯 Разведка: цель найдена!', scoutNoTarget: '🔍 Больше нечего разведывать',
      placeHint: '<b>Тапните по своему полю</b> — корабль встанет в эту клетку.',
      statusLeft: 'Осталось: {n}', statusReady: 'Готово',
      statusYourTurn: 'Ваш ход', statusEnemyTurn: 'Противник...', statusTurn: 'Ход игрока {n}',
      win: '🎉 Победа!', lose: '💥 Поражение', playerWin: '🎉 Победил игрок {n}!',
      passTitle: 'Игрок {n}',
      passPlacement: 'Игрок {n} расставил корабли. Передайте устройство игроку {n2}.',
      passMiss: 'Игрок {n} промахнулся. Передайте устройство.',
      passReady: 'Оба флота готовы. Начинает игрок {n}.',
      ready: 'Готов',
      yourFleet: 'Ваш флот', enemyFleet: 'Флот противника',
      playerField: 'Игрок {n} — своё поле', enemyField: 'Игрок {n} — поле противника',
      playerPrefix: 'Игрок {n} · '
    },
    en: {
      title: 'Battleship',
      menuBot: '🤖 Play vs Bot', menuBotSub: 'Against computer',
      menuDuo: '👥 Two Players', menuDuoSub: 'Take turns on one device',
      shipLabel: 'Ship', leftLabel: 'Left',
      horizontal: 'Horizontal', vertical: 'Vertical',
      ship4: 'Battleship', ship3: 'Cruiser', ship2: 'Destroyer', ship1: 'Boat',
      rotate: '⟳ Rotate', random: '🎲 Random', clear: '✕ Clear',
      backToMenu: '← Menu',
      scout: '📺 Scout', scoutCooling: '⏳ {n}s', scoutLoading: '⏳ ...',
      scoutFound: '🎯 Scout: found!', scoutNoTarget: '🔍 Nothing to scout',
      placeHint: '<b>Tap your field</b> to place a ship.',
      statusLeft: 'Left: {n}', statusReady: 'Ready',
      statusYourTurn: 'Your turn', statusEnemyTurn: 'Opponent...', statusTurn: "Player {n}'s turn",
      win: '🎉 Victory!', lose: '💥 Defeat', playerWin: '🎉 Player {n} wins!',
      passTitle: 'Player {n}',
      passPlacement: 'Player {n} placed ships. Pass to player {n2}.',
      passMiss: 'Player {n} missed. Pass the device.',
      passReady: 'Both ready. Player {n} starts.',
      ready: 'Ready',
      yourFleet: 'Your fleet', enemyFleet: 'Enemy fleet',
      playerField: 'Player {n} — own field', enemyField: 'Player {n} — enemy field',
      playerPrefix: 'Player {n} · '
    },
    tr: {
      title: 'Amiral Battı',
      menuBot: '🤖 Botla Oyna', menuBotSub: 'Bilgisayara karşı',
      menuDuo: '👥 İki Kişilik', menuDuoSub: 'Tek cihazda sırayla',
      shipLabel: 'Gemi', leftLabel: 'Kalan',
      horizontal: 'Yatay', vertical: 'Dikey',
      ship4: 'Zırhlı', ship3: 'Kruvazör', ship2: 'Muhrip', ship1: 'Bot',
      rotate: '⟳ Döndür', random: '🎲 Rastgele', clear: '✕ Temizle',
      backToMenu: '← Menü',
      scout: '📺 Keşif', scoutCooling: '⏳ {n}sn', scoutLoading: '⏳ ...',
      scoutFound: '🎯 Keşif: bulundu!', scoutNoTarget: '🔍 Keşfedilecek yok',
      placeHint: '<b>Kendi alanına dokun</b> — gemi buraya yerleşir.',
      statusLeft: 'Kalan: {n}', statusReady: 'Hazır',
      statusYourTurn: 'Sıra sende', statusEnemyTurn: 'Rakip...', statusTurn: 'Oyuncu {n} sırası',
      win: '🎉 Zafer!', lose: '💥 Yenilgi', playerWin: '🎉 Oyuncu {n} kazandı!',
      passTitle: 'Oyuncu {n}',
      passPlacement: 'Oyuncu {n} hazır. Cihazı oyuncu {n2} verin.',
      passMiss: 'Oyuncu {n} ıskaladı. Cihazı verin.',
      passReady: 'İki filo hazır. Oyuncu {n} başlıyor.',
      ready: 'Hazır',
      yourFleet: 'Kendi filon', enemyFleet: 'Düşman filosu',
      playerField: 'Oyuncu {n} — kendi alanı', enemyField: 'Oyuncu {n} — düşman alanı',
      playerPrefix: 'Oyuncu {n} · '
    }
  };

  let LANG = 'ru';

  function t(key, params) {
    const dict = TRANSLATIONS[LANG] || TRANSLATIONS.ru;
    let str = dict[key] || (TRANSLATIONS.ru[key] || key);
    if (params) for (const k in params) str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]);
    return str;
  }

  function applyTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    if (typeof phase !== 'undefined') {
      if (phase === 'placement') renderPlacementInfo();
      if (phase === 'battle') updateStatus();
      if (phase !== 'menu' && boards.length) renderAll();
    }
  }

  function detectLocalLang() {
    const lang = (navigator.language || 'ru').toLowerCase();
    if (lang.startsWith('tr')) return 'tr';
    if (lang.startsWith('en')) return 'en';
    if (lang.startsWith('ru')) return 'ru';
    return 'en';
  }

  const SCOUT_COOLDOWN_MS = 60000;

  const SIZE = 10;
  const SHIP_CONFIG = [
    { size: 4, count: 1 }, { size: 3, count: 2 },
    { size: 2, count: 3 }, { size: 1, count: 4 },
  ];

  const playerGridEl = document.getElementById('playerGrid');
  const enemyGridEl  = document.getElementById('enemyGrid');
  const statusEl     = document.getElementById('status');
  const fleetListEl  = document.getElementById('fleetList');
  const placementPanel = document.getElementById('placementPanel');
  const rotateBtn    = document.getElementById('rotateBtn');
  const randomBtn    = document.getElementById('randomBtn');
  const clearBtn     = document.getElementById('clearBtn');
  const newGameBtn   = document.getElementById('newGameBtn');
  const scoutBtn     = document.getElementById('scoutBtn');
  const leftTitle    = document.getElementById('leftTitle');
  const rightTitle   = document.getElementById('rightTitle');

  const shipSizeLabel = document.getElementById('shipSizeLabel');
  const shipsLeftLabel = document.getElementById('shipsLeftLabel');
  const orientationBadge = document.getElementById('orientationBadge');

  const menuEl    = document.getElementById('menu');
  const passEl    = document.getElementById('pass');
  const passTitle = document.getElementById('passTitle');
  const passText  = document.getElementById('passText');
  const passBtn   = document.getElementById('passBtn');

  document.getElementById('menuBot').addEventListener('click', () => startGame('bot'));
  document.getElementById('menuDuo').addEventListener('click', () => startGame('duo'));

  let mode = null, boards = [], phase = 'menu';
  let activePlayer = 0, playerTurn = true, busy = false;
  let shipsToPlace = [], currentShipIdx = 0, horizontal = true;
  let previewCells = [], previewValid = false, aiHitCells = [];
  let scoutCooldownEnd = [0, 0], scoutTimerId = null;
  let playerCells = [], enemyCells = [];

  function createBoard() {
    const cells = [];
    for (let r = 0; r < SIZE; r++) {
      const row = [];
      for (let c = 0; c < SIZE; c++) row.push({ ship: null, shot: false, auto: false, scouted: false });
      cells.push(row);
    }
    return { cells, ships: [] };
  }

  function canPlace(board, r, c, size, horiz) {
    for (let i = 0; i < size; i++) {
      const rr = r + (horiz ? 0 : i), cc = c + (horiz ? i : 0);
      if (rr < 0 || cc < 0 || rr >= SIZE || cc >= SIZE) return false;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const nr = rr + dr, nc = cc + dc;
        if (nr < 0 || nc < 0 || nr >= SIZE || nc >= SIZE) continue;
        if (board.cells[nr][nc].ship) return false;
      }
    }
    return true;
  }

  function placeShip(board, r, c, size, horiz) {
    const ship = { id: board.ships.length, size, cells: [], hits: 0, sunk: false };
    for (let i = 0; i < size; i++) {
      const rr = r + (horiz ? 0 : i), cc = c + (horiz ? i : 0);
      board.cells[rr][cc].ship = ship;
      ship.cells.push({ r: rr, c: cc });
    }
    board.ships.push(ship);
    return ship;
  }

  function randomFill(board) {
    board.cells.forEach(row => row.forEach(cell => { cell.ship = null; cell.scouted = false; }));
    board.ships = [];
    for (const cfg of SHIP_CONFIG) for (let n = 0; n < cfg.count; n++) {
      let placed = false, tries = 0;
      while (!placed && tries < 3000) {
        const horiz = Math.random() < 0.5;
        const r = Math.floor(Math.random() * SIZE), c = Math.floor(Math.random() * SIZE);
        if (canPlace(board, r, c, cfg.size, horiz)) { placeShip(board, r, c, cfg.size, horiz); placed = true; }
        tries++;
      }
    }
  }

  function buildShipList() {
    const list = [];
    SHIP_CONFIG.forEach(cfg => { for (let i = 0; i < cfg.count; i++) list.push(cfg.size); });
    return list;
  }

  function shipName(size) { return t('ship' + size); }

  function shoot(board, r, c) {
    const cell = board.cells[r][c];
    if (cell.shot) return null;
    cell.shot = true;
    if (cell.ship) {
      cell.ship.hits++;
      if (cell.ship.hits >= cell.ship.size) {
        cell.ship.sunk = true;
        for (const sc of cell.ship.cells) for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
          const nr = sc.r + dr, nc = sc.c + dc;
          if (nr < 0 || nc < 0 || nr >= SIZE || nc >= SIZE) continue;
          const ncell = board.cells[nr][nc];
          if (!ncell.shot) { ncell.shot = true; ncell.auto = true; }
        }
        return 'sunk';
      }
      return 'hit';
    }
    return 'miss';
  }

  function buildGrid(gridEl, arr, onClick) {
    gridEl.innerHTML = ''; arr.length = 0;
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const d = document.createElement('div');
      d.className = 'cell'; d.dataset.r = r; d.dataset.c = c;
      d.addEventListener('click', (e) => { e.preventDefault(); onClick(r, c); });
      d.addEventListener('contextmenu', (e) => { e.preventDefault(); if (phase === 'placement') rotate(); });
      gridEl.appendChild(d); arr.push(d);
    }
  }

  function paintBoard(arr, board, showShips) {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const el = arr[r * SIZE + c], cell = board.cells[r][c];
      let cls = 'cell';
      if (cell.shot) {
        cls += ' shot';
        if (cell.ship) cls += cell.ship.sunk ? ' sunk' : ' hit';
        else cls += cell.auto ? ' auto' : ' miss';
      } else if (showShips && cell.ship) {
        cls += ' ship ship-size-' + cell.ship.size;
      } else if (cell.scouted) cls += ' scouted';
      el.className = cls;
    }
  }

  function getLeftBoard()  { return mode === 'bot' ? boards[0] : boards[activePlayer]; }
  function getRightBoard() { return mode === 'bot' ? boards[1] : boards[1 - activePlayer]; }

  function updateBattleModeClass() {
    if (phase === 'battle') {
      document.body.classList.add('battle-mode');
    } else {
      document.body.classList.remove('battle-mode');
    }
  }

  function renderAll() {
    if (phase === 'menu' || !boards.length) {
      updateBattleModeClass();
      return;
    }
    paintBoard(playerCells, getLeftBoard(), true);
    paintBoard(enemyCells, getRightBoard(), phase === 'over');

    if (phase === 'placement' && previewCells.length) {
      for (const p of previewCells) {
        const el = playerCells[p.r * SIZE + p.c];
        if (!el.classList.contains('ship')) el.classList.add(previewValid ? 'preview-ok' : 'preview-bad');
      }
    }

    if (mode === 'bot') {
      leftTitle.textContent = t('yourFleet');
      rightTitle.textContent = t('enemyFleet');
    } else {
      leftTitle.textContent = t('playerField', { n: activePlayer + 1 });
      rightTitle.textContent = t('enemyField', { n: (1 - activePlayer) + 1 });
    }

    enemyGridEl.classList.toggle('enemy-active', phase === 'battle' && !busy && (mode === 'duo' || playerTurn));
    playerGridEl.classList.toggle('place-active', phase === 'placement');
    updateScoutButton();

    updateBattleModeClass();
  }

  function renderFleetList() {
    fleetListEl.innerHTML = '';
    shipsToPlace.forEach((size, i) => {
      const chip = document.createElement('div');
      chip.className = 'chip chip-size-' + size;
      if (i === currentShipIdx) chip.classList.add('active');
      if (i < currentShipIdx) chip.classList.add('done');
      for (let k = 0; k < size; k++) {
        const b = document.createElement('span'); b.className = 'blk'; chip.appendChild(b);
      }
      fleetListEl.appendChild(chip);
    });
  }

  function renderPlacementInfo() {
    const size = shipsToPlace[currentShipIdx];
    if (size === undefined) return;
    shipSizeLabel.textContent = shipName(size);
    shipsLeftLabel.textContent = shipsToPlace.length - currentShipIdx;
    const badge = document.getElementById('orientationText');
    if (horizontal) {
      orientationBadge.classList.remove('vertical');
      badge.textContent = t('horizontal');
    } else {
      orientationBadge.classList.add('vertical');
      badge.textContent = t('vertical');
    }
  }

  function updateStatus() {
    if (phase === 'menu') { statusEl.textContent = ''; statusEl.className = 'status'; return; }
    if (phase === 'over') return;
    if (phase === 'placement') {
      const left = shipsToPlace.length - currentShipIdx;
      let who = mode === 'duo' ? t('playerPrefix', { n: activePlayer + 1 }) : '';
      statusEl.textContent = left > 0 ? who + t('statusLeft', { n: left }) : who + t('statusReady');
      statusEl.className = 'status';
      return;
    }
    if (mode === 'bot') {
      statusEl.textContent = playerTurn ? t('statusYourTurn') : t('statusEnemyTurn');
      statusEl.className = 'status ' + (playerTurn ? 'you' : 'enemy');
    } else {
      statusEl.textContent = t('statusTurn', { n: activePlayer + 1 });
      statusEl.className = 'status ' + (activePlayer === 0 ? 'you' : 'enemy');
    }
  }

  function updateScoutButton() {
    if (phase !== 'battle') { scoutBtn.style.display = 'none'; stopScoutTimer(); return; }
    scoutBtn.style.display = '';
    const idx = mode === 'bot' ? 0 : activePlayer;
    const remain = scoutCooldownEnd[idx] - Date.now();
    if (remain > 0) {
      scoutBtn.disabled = true; scoutBtn.classList.add('cooldown');
      scoutBtn.textContent = t('scoutCooling', { n: Math.ceil(remain / 1000) });
      startScoutTimer();
    } else {
      scoutBtn.disabled = false; scoutBtn.classList.remove('cooldown');
      scoutBtn.textContent = t('scout');
      stopScoutTimer();
    }
  }

  function startScoutTimer() {
    if (scoutTimerId) return;
    scoutTimerId = setInterval(() => { if (phase !== 'battle') { stopScoutTimer(); return; } updateScoutButton(); }, 1000);
  }
  function stopScoutTimer() { if (scoutTimerId) { clearInterval(scoutTimerId); scoutTimerId = null; } }

  function tryScout() {
    if (phase !== 'battle') return;
    const idx = mode === 'bot' ? 0 : activePlayer;
    if (Date.now() < scoutCooldownEnd[idx]) return;
    const targetBoard = mode === 'bot' ? boards[1] : boards[1 - activePlayer];
    let hasCandidates = false;
    for (let r = 0; r < SIZE && !hasCandidates; r++) for (let c = 0; c < SIZE; c++) {
      const cell = targetBoard.cells[r][c];
      if (cell.ship && !cell.shot && !cell.scouted) { hasCandidates = true; break; }
    }
    if (!hasCandidates) {
      statusEl.textContent = t('scoutNoTarget');
      statusEl.className = 'status scout';
      setTimeout(() => updateStatus(), 1500);
      return;
    }
    scoutBtn.disabled = true; scoutBtn.classList.add('cooldown');
    scoutBtn.textContent = t('scoutLoading');

    // Заглушка вместо рекламы — награда выдаётся сразу
    doScout(targetBoard);
    scoutCooldownEnd[idx] = Date.now() + SCOUT_COOLDOWN_MS;
    renderAll();
    statusEl.textContent = t('scoutFound');
    statusEl.className = 'status scout';
    setTimeout(() => updateStatus(), 1800);
    if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
  }

  function doScout(board) {
    const candidates = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const cell = board.cells[r][c];
      if (cell.ship && !cell.shot && !cell.scouted) candidates.push({ r, c });
    }
    if (!candidates.length) return;
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    board.cells[pick.r][pick.c].scouted = true;
  }

  function showPass(title, text, callback) {
    passTitle.textContent = title;
    passText.textContent = text;
    passEl.classList.remove('hidden');
    passBtn.onclick = () => { passEl.classList.add('hidden'); callback(); };
  }

  function setPreview(r, c) {
    previewCells = []; previewValid = false;
    if (phase !== 'placement') return;
    const size = shipsToPlace[currentShipIdx];
    if (size === undefined) return;
    const cells = [];
    for (let i = 0; i < size; i++) {
      const rr = r + (horizontal ? 0 : i), cc = c + (horizontal ? i : 0);
      if (rr >= SIZE || cc >= SIZE) { previewCells = []; renderAll(); return; }
      cells.push({ r: rr, c: cc });
    }
    previewCells = cells;
    previewValid = canPlace(getLeftBoard(), r, c, size, horizontal);
    renderAll();
  }

  function clearPreview() { previewCells = []; previewValid = false; renderAll(); }

  function handlePlayerClick(r, c) {
    if (phase !== 'placement') return;
    const board = getLeftBoard();
    const size = shipsToPlace[currentShipIdx];
    if (size === undefined) return;
    if (!canPlace(board, r, c, size, horizontal)) {
      previewCells = []; previewValid = false;
      for (let i = 0; i < size; i++) {
        const rr = r + (horizontal ? 0 : i), cc = c + (horizontal ? i : 0);
        if (rr < SIZE && cc < SIZE) previewCells.push({ r: rr, c: cc });
      }
      renderAll();
      setTimeout(clearPreview, 350);
      if (navigator.vibrate) navigator.vibrate(40);
      return;
    }
    placeShip(board, r, c, size, horizontal);
    currentShipIdx++; previewCells = [];
    if (currentShipIdx >= shipsToPlace.length) {
      if (mode === 'bot') {
        phase = 'battle'; playerTurn = true;
        placementPanel.classList.add('hidden');
        renderAll(); updateStatus();
      } else {
        if (activePlayer === 0) {
          renderAll(); updateStatus();
          showPass(t('passTitle', { n: 2 }), t('passPlacement', { n: 1, n2: 2 }), () => {
            activePlayer = 1; currentShipIdx = 0;
            shipsToPlace = buildShipList(); previewCells = [];
            renderFleetList(); renderPlacementInfo(); renderAll(); updateStatus();
          });
        } else {
          phase = 'battle'; activePlayer = 0;
          placementPanel.classList.add('hidden');
          renderAll(); updateStatus();
          showPass(t('passTitle', { n: 1 }), t('passReady', { n: 1 }), () => { renderAll(); updateStatus(); });
        }
      }
    } else {
      renderFleetList(); renderPlacementInfo(); renderAll();
    }
    updateStatus();
  }

  function rotate() {
    if (phase !== 'placement') return;
    horizontal = !horizontal;
    renderPlacementInfo();
    if (previewCells.length) { const last = previewCells[0]; setPreview(last.r, last.c); }
    if (navigator.vibrate) navigator.vibrate(15);
  }

  function handleEnemyClick(r, c) {
    if (phase !== 'battle' || busy) return;
    if (mode === 'bot' && !playerTurn) return;
    const targetBoard = mode === 'bot' ? boards[1] : boards[1 - activePlayer];
    const cell = targetBoard.cells[r][c];
    if (cell.shot) return;
    busy = true;
    const res = shoot(targetBoard, r, c);
    renderAll();
    if (targetBoard.ships.every(s => s.sunk)) { busy = false; endGame(activePlayer); return; }
    if (res === 'miss') {
      if (mode === 'bot') {
        playerTurn = false; busy = false; renderAll(); updateStatus();
        setTimeout(aiTurn, 620);
      } else {
        const nextPlayer = 1 - activePlayer;
        busy = false; renderAll(); updateStatus();
        showPass(t('passTitle', { n: nextPlayer + 1 }), t('passMiss', { n: activePlayer + 1 }),
          () => { activePlayer = nextPlayer; renderAll(); updateStatus(); });
      }
    } else { busy = false; renderAll(); updateStatus(); }
  }

  function aiChooseTarget() {
    const board = boards[0];
    const free = (r, c) => r >= 0 && c >= 0 && r < SIZE && c < SIZE && !board.cells[r][c].shot;
    if (aiHitCells.length) {
      const byRow = {}, byCol = {};
      for (const h of aiHitCells) {
        (byRow[h.r] = byRow[h.r] || []).push(h.c);
        (byCol[h.c] = byCol[h.c] || []).push(h.r);
      }
      for (const key in byRow) {
        const cs = byRow[key].sort((a, b) => a - b);
        if (cs.length >= 2) {
          const r = +key;
          if (free(r, cs[0] - 1)) return { r, c: cs[0] - 1 };
          if (free(r, cs[cs.length - 1] + 1)) return { r, c: cs[cs.length - 1] + 1 };
        }
      }
      for (const key in byCol) {
        const rs = byCol[key].sort((a, b) => a - b);
        if (rs.length >= 2) {
          const c = +key;
          if (free(rs[0] - 1, c)) return { r: rs[0] - 1, c };
          if (free(rs[rs.length - 1] + 1, c)) return { r: rs[rs.length - 1] + 1, c };
        }
      }
      const neighbors = [];
      for (const h of aiHitCells) for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
        const nr = h.r + dr, nc = h.c + dc;
        if (free(nr, nc)) neighbors.push({ r: nr, c: nc });
      }
      if (neighbors.length) return neighbors[Math.floor(Math.random() * neighbors.length)];
    }
    const avail = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!board.cells[r][c].shot) avail.push({ r, c });
    const ch = avail.filter(p => (p.r + p.c) % 2 === 0);
    return (ch.length ? ch : avail)[Math.floor(Math.random() * (ch.length || avail.length))];
  }

  function aiTurn() {
    if (phase !== 'battle' || mode !== 'bot') return;
    busy = true;
    const target = aiChooseTarget();
    if (!target) { busy = false; return; }
    const res = shoot(boards[0], target.r, target.c);
    if (res === 'hit') aiHitCells.push(target);
    else if (res === 'sunk') {
      const ship = boards[0].cells[target.r][target.c].ship;
      aiHitCells = aiHitCells.filter(h => !ship.cells.some(sc => sc.r === h.r && sc.c === h.c));
    }
    renderAll();
    if (boards[0].ships.every(s => s.sunk)) { busy = false; endGame(1); return; }
    if (res === 'miss') { playerTurn = true; busy = false; renderAll(); updateStatus(); }
    else { updateStatus(); setTimeout(aiTurn, 620); }
  }

  function endGame(winnerIdx) {
    phase = 'over'; busy = false;
    stopScoutTimer();
    if (mode === 'bot') {
      const playerWon = winnerIdx === 0;
      statusEl.textContent = playerWon ? t('win') : t('lose');
      statusEl.className = 'status ' + (playerWon ? 'win' : 'lose');
    } else {
      statusEl.textContent = t('playerWin', { n: winnerIdx + 1 });
      statusEl.className = 'status win';
    }
    paintBoard(enemyCells, getRightBoard(), true);
    enemyGridEl.classList.remove('enemy-active');
    playerGridEl.classList.remove('place-active');
    scoutBtn.style.display = 'none';
    updateBattleModeClass();
  }

  function startGame(m) {
    mode = m;
    boards = [createBoard(), createBoard()];
    if (m === 'bot') randomFill(boards[1]);
    activePlayer = 0; playerTurn = true; busy = false;
    shipsToPlace = buildShipList(); currentShipIdx = 0;
    horizontal = true; previewCells = []; previewValid = false;
    aiHitCells = []; scoutCooldownEnd = [0, 0]; stopScoutTimer();
    phase = 'placement';

    buildGrid(playerGridEl, playerCells, handlePlayerClick);
    buildGrid(enemyGridEl, enemyCells, handleEnemyClick);

    menuEl.classList.add('hidden');
    passEl.classList.add('hidden');
    placementPanel.classList.remove('hidden');
    renderFleetList(); renderPlacementInfo(); renderAll(); updateStatus();
  }

  function backToMenu() {
    stopScoutTimer();
    phase = 'menu'; boards = []; playerCells = []; enemyCells = [];
    playerGridEl.innerHTML = ''; enemyGridEl.innerHTML = ''; fleetListEl.innerHTML = '';
    placementPanel.classList.add('hidden');
    passEl.classList.add('hidden');
    menuEl.classList.remove('hidden');
    statusEl.textContent = ''; statusEl.className = 'status';
    leftTitle.textContent = t('yourFleet');
    rightTitle.textContent = t('enemyFleet');
    scoutBtn.style.display = 'none';
    updateBattleModeClass();
  }

  buildGrid(playerGridEl, playerCells, handlePlayerClick);
  buildGrid(enemyGridEl, enemyCells, handleEnemyClick);

  playerGridEl.addEventListener('mouseover', e => {
    if (phase !== 'placement') return;
    const el = e.target.closest('.cell');
    if (!el) return;
    setPreview(+el.dataset.r, +el.dataset.c);
  });
  playerGridEl.addEventListener('mouseleave', clearPreview);

  rotateBtn.addEventListener('click', rotate);
  newGameBtn.addEventListener('click', backToMenu);
  scoutBtn.addEventListener('click', tryScout);

  randomBtn.addEventListener('click', () => {
    if (phase !== 'placement') return;
    randomFill(getLeftBoard());
    currentShipIdx = shipsToPlace.length; previewCells = [];
    if (mode === 'bot') {
      phase = 'battle'; playerTurn = true;
      placementPanel.classList.add('hidden');
      renderAll(); updateStatus();
    } else {
      if (activePlayer === 0) {
        renderAll(); updateStatus();
        showPass(t('passTitle', { n: 2 }), t('passPlacement', { n: 1, n2: 2 }), () => {
          activePlayer = 1; currentShipIdx = 0;
          shipsToPlace = buildShipList(); previewCells = [];
          renderFleetList(); renderPlacementInfo(); renderAll(); updateStatus();
        });
      } else {
        phase = 'battle'; activePlayer = 0;
        placementPanel.classList.add('hidden');
        renderAll(); updateStatus();
        showPass(t('passTitle', { n: 1 }), t('passReady', { n: 1 }), () => { renderAll(); updateStatus(); });
      }
    }
  });

  clearBtn.addEventListener('click', () => {
    if (phase !== 'placement') return;
    const board = getLeftBoard();
    board.cells.forEach(row => row.forEach(cell => { cell.ship = null; }));
    board.ships = []; currentShipIdx = 0; previewCells = [];
    renderAll(); renderFleetList(); renderPlacementInfo(); updateStatus();
  });

  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'r' || k === 'к') { e.preventDefault(); rotate(); }
  });

  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  applyTranslations();
  backToMenu();
  LANG = detectLocalLang();
  applyTranslations();
})();
</script>
</body>
</html>
