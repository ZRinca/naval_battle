<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#061520">
<title>Морской бой</title>
<script src="/sdk.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --cell: clamp(26px, 3.6vw, 40px);
    --gap: 2px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);

    --ship4-c1: #f0a0a0;  --ship4-c2: #d05050;  --ship4-c3: #8a2c2c;
    --ship3-c1: #f0c890;  --ship3-c2: #e0a040;  --ship3-c3: #9a6420;
    --ship2-c1: #a8e0b8;  --ship2-c2: #60b878;  --ship2-c3: #2e7848;
    --ship1-c1: #a8d0f0;  --ship1-c2: #5a9ad0;  --ship1-c3: #2e6498;
  }

  html, body { height: 100%; margin: 0; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: calc(14px + var(--safe-top)) calc(14px + var(--safe-right))
             calc(20px + var(--safe-bottom)) calc(14px + var(--safe-left));
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: #dceeff;
    background:
      radial-gradient(circle at 20% -10%, #1b4a6e 0%, transparent 55%),
      radial-gradient(circle at 90% 110%, #123b52 0%, transparent 50%),
      linear-gradient(180deg, #061520 0%, #030a12 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .game {
    width: 100%;
    max-width: 1100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .main-title {
    margin: 0;
    text-align: center;
    font-size: clamp(20px, 3.4vw, 32px);
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 800;
    background: linear-gradient(180deg, #bfe9ff, #4d9dc9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 6px 24px rgba(70, 170, 230, .25);
    line-height: 1.15;
  }

  .boards {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: clamp(14px, 3vw, 40px);
    flex-wrap: wrap;
    width: 100%;
  }

  .board-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .board-title {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #6fa8cc;
    font-weight: 700;
    text-align: center;
    white-space: nowrap;
    line-height: 1.2;
    min-height: 14px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(10, var(--cell));
    grid-template-rows: repeat(10, var(--cell));
    gap: var(--gap);
    padding: 6px;
    border-radius: 11px;
    background: rgba(10, 40, 65, .55);
    border: 1px solid rgba(90, 175, 230, .18);
    box-shadow:
      0 14px 40px rgba(0, 0, 0, .55),
      inset 0 0 40px rgba(60, 150, 210, .07);
    touch-action: manipulation;
  }

  .grid.enemy-active .cell:not(.shot):active {
    background: #24506f;
    transform: scale(1.08);
    box-shadow: 0 0 10px rgba(90, 200, 255, .5);
  }

  .grid.place-active .cell:not(.ship):active {
    background: #1d445f;
    transform: scale(1.06);
  }

  @media (hover: hover) and (pointer: fine) {
    .grid.enemy-active .cell:not(.shot):hover {
      background: #24506f;
      transform: scale(1.08);
      box-shadow: 0 0 10px rgba(90, 200, 255, .5);
    }
    .grid.place-active .cell:not(.ship):hover {
      background: #1d445f;
      transform: scale(1.06);
    }
  }

  .cell {
    position: relative;
    border-radius: 3px;
    background: linear-gradient(160deg, #10314c, #0b2237);
    box-shadow: inset 0 1px 0 rgba(120, 200, 255, .07);
    transition: background .12s ease, transform .12s ease, box-shadow .12s ease;
    cursor: pointer;
  }

  .cell.ship-size-1 { --c1: var(--ship1-c1); --c2: var(--ship1-c2); --c3: var(--ship1-c3); }
  .cell.ship-size-2 { --c1: var(--ship2-c1); --c2: var(--ship2-c2); --c3: var(--ship2-c3); }
  .cell.ship-size-3 { --c1: var(--ship3-c1); --c2: var(--ship3-c2); --c3: var(--ship3-c3); }
  .cell.ship-size-4 { --c1: var(--ship4-c1); --c2: var(--ship4-c2); --c3: var(--ship4-c3); }

  .cell.ship {
    background: linear-gradient(180deg, var(--c1) 0%, var(--c2) 45%, var(--c3) 100%);
    box-shadow:
      0 0 0 1px var(--c2),
      inset 0 1px 0 rgba(255, 255, 255, .45),
      inset 0 -1px 0 rgba(0, 0, 0, .28),
      0 2px 6px rgba(0, 0, 0, .35);
  }

  .cell.ship-shape-single { border-radius: 50%; }
  .cell.ship-shape-h-bow   { border-radius: 50% 2px 2px 50% / 50% 2px 2px 50%; }
  .cell.ship-shape-h-mid   { border-radius: 2px; }
  .cell.ship-shape-h-stern { border-radius: 2px 50% 50% 2px / 2px 50% 50% 2px; }
  .cell.ship-shape-v-bow   { border-radius: 50% 50% 2px 2px / 50% 50% 2px 2px; }
  .cell.ship-shape-v-mid   { border-radius: 2px; }
  .cell.ship-shape-v-stern { border-radius: 2px 2px 50% 50% / 2px 2px 50% 50%; }

  .cell.miss::after,
  .cell.auto::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    width: 26%; height: 26%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #35688f;
  }
  .cell.auto::after { background: #244a68; }

  .cell.hit {
    background: linear-gradient(160deg, #ff7a4d, #d92e2e);
    box-shadow:
      0 0 0 1px #d92e2e,
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -1px 0 rgba(0,0,0,.3),
      0 0 12px rgba(255, 90, 60, .6);
  }

  .cell.sunk {
    background: linear-gradient(160deg, #5c1c1c, #39100f);
    box-shadow:
      0 0 0 1px #39100f,
      inset 0 0 10px rgba(0,0,0,.7);
  }

  .cell.hit::after,
  .cell.sunk::after {
    content: '✕';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--cell) * .62);
    font-weight: 800;
    line-height: 1;
    color: rgba(255, 255, 255, .9);
    text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  .cell.sunk::after { color: rgba(255, 190, 180, .55); }

  .cell.scouted {
    background: linear-gradient(160deg, #2a4a2a, #1a3a1a);
    box-shadow: 0 0 0 1px rgba(255, 210, 100, .4);
  }

  .cell.scouted::before {
    content: '';
    position: absolute;
    inset: 14%;
    border: 2.5px solid #ffcc44;
    border-radius: 50%;
    box-shadow:
      0 0 14px rgba(255, 200, 70, .8),
      inset 0 0 8px rgba(255, 200, 70, .5);
    animation: scoutPulse 1.4s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes scoutPulse {
    0%, 100% { opacity: .95; transform: scale(.82); }
    50%      { opacity: .45; transform: scale(1.12); }
  }

  .cell.preview-ok {
    background: linear-gradient(180deg, #6de0a0 0%, #40b878 45%, #208050 100%);
    box-shadow:
      0 0 0 1px #40b878,
      0 0 12px rgba(70, 220, 140, .6),
      inset 0 1px 0 rgba(255,255,255,.35);
  }

  .cell.preview-bad {
    background: linear-gradient(180deg, #ff8080 0%, #d04040 45%, #902020 100%);
    box-shadow:
      0 0 0 1px #d04040,
      0 0 12px rgba(255, 80, 80, .55),
      inset 0 1px 0 rgba(255,255,255,.3);
  }

  .status {
    min-height: 28px;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: .3px;
    text-align: center;
    padding: 5px 18px;
    border-radius: 999px;
    transition: color .2s, background .2s;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.35;
  }

  .status.you   { color: #7fe0a8; background: rgba(60, 200, 130, .1); }
  .status.enemy { color: #ff9a8a; background: rgba(255, 100, 80, .1); }
  .status.win   { color: #8ff0b8; background: rgba(60, 220, 140, .14); box-shadow: 0 0 24px rgba(60,220,140,.15); }
  .status.lose  { color: #ff8f8f; background: rgba(255, 80, 80, .14); box-shadow: 0 0 24px rgba(255,80,80,.15); }
  .status.scout { color: #ffdd77; background: rgba(255, 200, 70, .18); box-shadow: 0 0 18px rgba(255,200,70,.25); }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  .panel.hidden { display: none; }

  .placement-info {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 6px 14px;
    border-radius: 11px;
    background: rgba(20, 55, 85, .5);
    border: 1px solid rgba(90, 175, 230, .2);
  }

  .placement-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 84px;
  }

  .placement-step .label {
    font-size: 9.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #6fa8cc;
    font-weight: 700;
    line-height: 1.1;
  }

  .placement-step .value {
    font-size: 14px;
    font-weight: 800;
    color: #cfe9fb;
    line-height: 1.15;
  }

  .orientation-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 11px;
    border-radius: 8px;
    background: linear-gradient(180deg, rgba(90, 200, 255, .2), rgba(50, 140, 200, .15));
    border: 1px solid rgba(120, 210, 255, .45);
    color: #bfe9ff;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: .5px;
    box-shadow: 0 0 12px rgba(90, 200, 255, .25);
    transition: all .2s;
    line-height: 1.15;
  }

  .orientation-badge .arrow {
    font-size: 16px;
    display: inline-block;
    transition: transform .25s ease;
  }

  .orientation-badge.vertical .arrow { transform: rotate(90deg); }

  .hint {
    font-size: 12.5px;
    color: #8fb8d4;
    text-align: center;
    max-width: 500px;
    line-height: 1.45;
    padding: 0 8px;
  }

  .hint b { color: #a8d8f5; }

  .fleet-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
  }

  .chip {
    display: flex;
    gap: 2px;
    padding: 3px;
    border-radius: 6px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(120, 190, 240, .15);
    transition: all .18s;
  }

  .chip .blk {
    width: 10px; height: 10px;
    border-radius: 3px;
    background: #3d6f96;
  }

  .chip.chip-size-1 .blk { background: var(--ship1-c2); border-radius: 50%; }
  .chip.chip-size-2 .blk { background: var(--ship2-c2); }
  .chip.chip-size-3 .blk { background: var(--ship3-c2); }
  .chip.chip-size-4 .blk { background: var(--ship4-c2); }

  .chip.active {
    border-color: #5ec8ff;
    background: rgba(90, 200, 255, .18);
    box-shadow: 0 0 14px rgba(90, 200, 255, .4);
    transform: translateY(-2px) scale(1.05);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 14px rgba(90, 200, 255, .4); }
    50%      { box-shadow: 0 0 22px rgba(90, 200, 255, .7); }
  }

  .chip.done { opacity: .25; }

  .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  /* Нижний ряд кнопок — фиксированной высоты, чтобы layout не прыгал */
  .btns-bottom {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    min-height: 42px;
  }

  button {
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: .3px;
    padding: 10px 16px;
    border-radius: 9px;
    border: 1px solid rgba(110, 190, 245, .3);
    background: linear-gradient(180deg, rgba(40, 95, 140, .8), rgba(20, 55, 85, .9));
    color: #cfe9fb;
    cursor: pointer;
    transition: background .15s, border-color .15s, box-shadow .15s, transform .1s;
    min-height: 40px;
    touch-action: manipulation;
    line-height: 1.1;
    white-space: nowrap;
  }

  button:active {
    transform: scale(.96);
    background: linear-gradient(180deg, rgba(55, 125, 180, .95), rgba(28, 72, 110, 1));
  }

  @media (hover: hover) and (pointer: fine) {
    button:hover {
      background: linear-gradient(180deg, rgba(55, 125, 180, .9), rgba(28, 72, 110, .95));
      border-color: rgba(120, 210, 255, .55);
      box-shadow: 0 0 16px rgba(80, 180, 255, .28);
    }
  }

  #rotateBtn {
    border-color: rgba(120, 210, 255, .55);
    background: linear-gradient(180deg, rgba(50, 130, 190, .9), rgba(28, 80, 130, .95));
    color: #e0f4ff;
    min-width: 130px;
  }

  /* Кнопка разведки — ФИКСИРОВАННАЯ ширина, чтобы layout не прыгал */
  #scoutBtn {
    border-color: rgba(255, 210, 130, .55);
    background: linear-gradient(180deg, rgba(200, 150, 55, .9), rgba(140, 95, 25, .95));
    color: #ffe8b8;
    text-shadow: 0 1px 2px rgba(0,0,0,.3);
    box-shadow: 0 0 14px rgba(255, 200, 100, .3);
    animation: scoutGlow 2s ease-in-out infinite;
    min-width: 250px;
    justify-content: center;
    text-align: center;
  }

  @keyframes scoutGlow {
    0%, 100% { box-shadow: 0 0 14px rgba(255, 200, 100, .3); }
    50%      { box-shadow: 0 0 22px rgba(255, 200, 100, .5); }
  }

  #scoutBtn:hover {
    background: linear-gradient(180deg, rgba(230, 180, 70, .95), rgba(165, 115, 35, 1));
    border-color: rgba(255, 225, 150, .8);
    box-shadow: 0 0 20px rgba(255, 200, 100, .55);
  }

  #scoutBtn.cooldown {
    opacity: .7;
    filter: grayscale(.3);
    cursor: wait;
    background: linear-gradient(180deg, rgba(120, 100, 60, .8), rgba(85, 65, 30, .9));
    border-color: rgba(180, 150, 90, .4);
    box-shadow: none;
    animation: none;
    color: #d8c9a8;
  }

  #scoutBtn.cooldown:hover { transform: none; box-shadow: none; }

  #newGameBtn {
    border-color: rgba(120, 255, 190, .3);
    background: linear-gradient(180deg, rgba(30, 110, 85, .75), rgba(15, 65, 50, .85));
    color: #c8f7e2;
    min-width: 130px;
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(3, 10, 18, .94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 100;
    padding: calc(16px + var(--safe-top)) calc(16px + var(--safe-right))
             calc(16px + var(--safe-bottom)) calc(16px + var(--safe-left));
    touch-action: none;
  }

  .overlay.hidden { display: none; }

  .overlay-box {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
    text-align: center;
    max-width: 380px;
    width: 100%;
    padding: 30px 24px;
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(15, 40, 62, .98), rgba(8, 22, 36, .98));
    border: 1px solid rgba(90, 175, 230, .22);
    box-shadow:
      0 24px 70px rgba(0,0,0,.75),
      inset 0 0 40px rgba(60, 150, 210, .05);
    animation: pop .25s ease;
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(.94) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .overlay-box h1 {
    margin: 0 0 6px;
    font-size: clamp(22px, 5.5vw, 28px);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 800;
    background: linear-gradient(180deg, #bfe9ff, #4d9dc9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1.15;
  }

  .overlay-box h2 {
    margin: 0;
    font-size: clamp(18px, 4.5vw, 22px);
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #a8d8f5;
    line-height: 1.2;
  }

  .overlay-box p {
    margin: 0;
    color: #7fa8c4;
    font-size: 13.5px;
    line-height: 1.5;
  }

  .menu-btn {
    width: 100%;
    padding: 14px 16px;
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: .6px;
    border-radius: 12px;
    min-height: 52px;
    white-space: normal;
    line-height: 1.3;
  }

  .menu-btn .sub {
    display: block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .4px;
    opacity: .6;
    margin-top: 3px;
    text-transform: none;
  }

  .menu-btn.bot {
    border-color: rgba(100, 190, 255, .35);
    background: linear-gradient(180deg, rgba(35, 90, 140, .8), rgba(18, 50, 80, .9));
  }

  .menu-btn.duo {
    border-color: rgba(255, 190, 100, .35);
    background: linear-gradient(180deg, rgba(140, 90, 35, .8), rgba(80, 50, 18, .9));
    color: #ffe3b8;
  }

  .overlay-box .icon {
    font-size: 40px;
    line-height: 1;
    margin-bottom: 2px;
    filter: drop-shadow(0 6px 18px rgba(80, 180, 255, .3));
  }

  /* ============================================================
     МОБИЛЬНАЯ ПОРТРЕТНАЯ
     ============================================================ */
  @media (max-aspect-ratio: 4/3) {
    :root { --cell: min(8vw, 8vh, 40px); }

    .game { gap: 10px; }

    .boards {
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .main-title { letter-spacing: 2px; }

    .placement-info { gap: 10px; padding: 5px 12px; }
    .placement-step { min-width: 76px; }

    button { font-size: 12.5px; padding: 9px 14px; min-height: 38px; }
    #scoutBtn { min-width: 220px; }
  }

  @media (max-width: 480px) {
    :root { --cell: min(8.8vw, 8.8vh, 36px); }
    body { padding: calc(8px + var(--safe-top)) calc(8px + var(--safe-right))
                  calc(14px + var(--safe-bottom)) calc(8px + var(--safe-left)); }
    .grid { padding: 4px; gap: 1.5px; }
    .main-title { font-size: 20px; }
    .overlay-box { padding: 22px 16px; }
    .hint { font-size: 11px; }
    .orientation-badge { font-size: 12px; padding: 4px 9px; }
    #scoutBtn { min-width: 200px; font-size: 12px; }
    #newGameBtn { min-width: 110px; }
  }

  /* ============================================================
     ЛАНДШАФТ ТЕЛЕФОНА
     ============================================================ */
  @media (max-height: 520px) and (orientation: landscape) {
    :root { --cell: min(7vh, 7vw, 38px); }
    body { padding: 6px 10px; }
    .main-title { display: none; }
    .game { gap: 6px; }
    .boards { gap: 14px; }
    .board-title { font-size: 9px; letter-spacing: 1px; }
    .grid { padding: 4px; gap: 1.5px; }
    .status { font-size: 12px; padding: 3px 14px; min-height: 22px; }
    .controls { gap: 6px; }
    .panel { gap: 6px; }
    .placement-info { padding: 3px 10px; gap: 10px; }
    .placement-step { min-width: 64px; }
    .placement-step .label { font-size: 8px; }
    .placement-step .value { font-size: 11.5px; }
    .orientation-badge { padding: 3px 9px; font-size: 11px; }
    .orientation-badge .arrow { font-size: 12px; }
    .hint { font-size: 10px; margin-top: -2px; }
    button { font-size: 11.5px; padding: 7px 12px; min-height: 32px; }
    #scoutBtn { min-width: 190px; }
    #newGameBtn { min-width: 100px; }
  }

  .grid, .cell {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
</style>
</head>
<body>
<div class="game">
  <h1 class="main-title" data-i18n="title">Морской бой</h1>

  <div class="boards">
    <div class="board-wrap">
      <div class="board-title" id="leftTitle">Ваш флот</div>
      <div class="grid" id="playerGrid"></div>

<script>
(() => {
  'use strict';

  // ============================================================

  const TRANSLATIONS = {

      scoutNoTarget: '🔍 Keşfedilecek bir şey yok',
      placeHint: '<b>Kendi alanına dokun</b> — gemi buraya yerleşir. <b>Döndür</b> düğmesi yönü değiştirir.',
      statusLeft: 'Kalan: {n}',
      statusReady: 'Hazır',
      statusYourTurn: 'Sıra sende',
      statusEnemyTurn: 'Rakip...',
      statusTurn: 'Oyuncu {n} sırası',
      win: '🎉 Zafer!',
      lose: '💥 Yenilgi',
      playerWin: '🎉 Oyuncu {n} kazandı!',
      passTitle: 'Oyuncu {n}',
      passPlacement: 'Oyuncu {n} gemilerini yerleştirdi. Cihazı oyuncu {n2} verin.',
      passMiss: 'Oyuncu {n} ıskaladı. Cihazı verin.',
      passReady: 'İki filo da hazır. Oyuncu {n} başlıyor.',
      ready: 'Hazır',
      yourFleet: 'Kendi filon',
      enemyFleet: 'Düşman filosu',
      playerField: 'Oyuncu {n} — kendi alanı',
      enemyField: 'Oyuncu {n} — düşman alanı',
      playerPrefix: 'Oyuncu {n} · '
    }
  };

  let LANG = 'ru';

  function t(key, params) {
    const dict = TRANSLATIONS[LANG] || TRANSLATIONS.ru;
    let str = dict[key] || (TRANSLATIONS.ru[key] || key);
    if (params) {
      for (const k in params) {
        str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]);
      }
    }
    return str;
  }

  function applyTranslations() {
    // data-i18n → textContent
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      el.textContent = t(key);
    });
    // data-i18n-html → innerHTML
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      const key = el.dataset.i18nHtml;
      el.innerHTML = t(key);
    });
    // Обновляем динамические тексты, если игра уже идёт
    if (typeof phase !== 'undefined') {
      if (phase === 'placement') renderPlacementInfo();
      if (phase === 'battle') updateStatus();
      if (phase !== 'menu' && boards.length) renderAll();
    }
  }

  function detectLocalLang() {
    const lang = (navigator.language || 'ru').toLowerCase();
    if (lang.startsWith('tr')) return 'tr';
    if (lang.startsWith('en')) return 'en';
    if (lang.startsWith('ru')) return 'ru';
    return 'en'; // по умолчанию английский для всех остальных
  }

  // ============================================================
  //  YANDEX GAMES SDK
  // ============================================================
  let ysdk = null;
  let lastAdTime = 0;
  const MIN_AD_INTERVAL = 60000;
  const SCOUT_COOLDOWN_MS = 60000;

  function initYandexSDK() {
    // Пока SDK грузится — ставим язык из браузера
    LANG = detectLocalLang();

    if (typeof YaGames === 'undefined') {
      console.warn('[YSDK] YaGames not found — running outside Yandex Games');
      applyTranslations();
      return;
    }

    YaGames.init()
      .then(sdk => {
        ysdk = sdk;
        console.log('[YSDK] Initialized');

        // Определяем язык из окружения Яндекса
        try {
          const yandexLang = ysdk.environment.i18n.lang;
          console.log('[YSDK] Language:', yandexLang);
          if (yandexLang === 'ru' || yandexLang === 'en' || yandexLang === 'tr') {
            LANG = yandexLang;
          } else if (yandexLang) {
            LANG = 'en'; // для остальных — английский
          }
        } catch (e) {
          console.warn('[YSDK] Could not detect lang, using browser');
        }

        applyTranslations();
        updateStatus();
        renderAll();

        ysdk.features.LoadingAPI?.ready();
      })
      .catch(err => {
        console.error('[YSDK] Init failed:', err);
        applyTranslations();
      });
  }

  function gameplayStart() {
    try { ysdk?.features?.GameplayAPI?.start(); } catch (e) {}
  }

  function gameplayStop() {
    try { ysdk?.features?.GameplayAPI?.stop(); } catch (e) {}
  }

  function showFullscreenAd(callback) {
    const now = Date.now();
    if (now - lastAdTime < MIN_AD_INTERVAL) { callback?.(); return; }
    if (!ysdk) { callback?.(); return; }

    ysdk.adv.showFullscreenAdv({
      callbacks: {
        onClose: () => { lastAdTime = Date.now(); callback?.(); },
        onError: (err) => { console.warn('[YSDK] Fullscreen ad error:', err); callback?.(); }
      }
    });
  }

  function showRewardedAd(onReward) {
    if (!ysdk) {
      console.log('[YSDK] No SDK — reward granted (dev mode)');
      onReward?.();
      return;
    }
    ysdk.adv.showRewardedVideo({
      callbacks: {
        onOpen: () => { gameplayStop(); },
        onRewarded: () => { console.log('[YSDK] Rewarded'); onReward?.(); },
        onClose: () => { if (phase === 'battle') gameplayStart(); },
        onError: (err) => { console.warn('[YSDK] Rewarded error:', err); if (phase === 'battle') gameplayStart(); }
      }
    });
  }

  // ============================================================
  //  ИГРА
  // ============================================================
  const SIZE = 10;
  const SHIP_CONFIG = [
    { size: 4, count: 1 },
    { size: 3, count: 2 },
    { size: 2, count: 3 },
    { size: 1, count: 4 },
  ];

  const playerGridEl = document.getElementById('playerGrid');
  const enemyGridEl  = document.getElementById('enemyGrid');
  const statusEl     = document.getElementById('status');
  const fleetListEl  = document.getElementById('fleetList');
  const placementPanel = document.getElementById('placementPanel');
  const rotateBtn    = document.getElementById('rotateBtn');
  const randomBtn    = document.getElementById('randomBtn');
  const clearBtn     = document.getElementById('clearBtn');
  const newGameBtn   = document.getElementById('newGameBtn');
  const scoutBtn     = document.getElementById('scoutBtn');
  const leftTitle    = document.getElementById('leftTitle');
  const rightTitle   = document.getElementById('rightTitle');

  const shipSizeLabel = document.getElementById('shipSizeLabel');
  const shipsLeftLabel = document.getElementById('shipsLeftLabel');
  const orientationBadge = document.getElementById('orientationBadge');
  const orientationText = document.getElementById('orientationText');

  const menuEl    = document.getElementById('menu');
  const passEl    = document.getElementById('pass');
  const passTitle = document.getElementById('passTitle');
  const passText  = document.getElementById('passText');
  const passBtn   = document.getElementById('passBtn');

  document.getElementById('menuBot').addEventListener('click', () => startGame('bot'));
  document.getElementById('menuDuo').addEventListener('click', () => startGame('duo'));

  let mode = null;
  let boards = [];
  let phase = 'menu';
  let activePlayer = 0;
  let playerTurn = true;
  let busy = false;
  let shipsToPlace = [];
  let currentShipIdx = 0;
  let horizontal = true;
  let previewCells = [];
  let previewValid = false;
  let aiHitCells = [];
  let scoutCooldownEnd = [0, 0];
  let scoutTimerId = null;

  let playerCells = [], enemyCells = [];

  function createBoard() {
    const cells = [];
    for (let r = 0; r < SIZE; r++) {
      const row = [];
      for (let c = 0; c < SIZE; c++) row.push({ ship: null, shot: false, auto: false, scouted: false });
      cells.push(row);
    }
    return { cells, ships: [] };
  }

  function canPlace(board, r, c, size, horiz) {
    for (let i = 0; i < size; i++) {
      const rr = r + (horiz ? 0 : i);
      const cc = c + (horiz ? i : 0);
      if (rr < 0 || cc < 0 || rr >= SIZE || cc >= SIZE) return false;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = rr + dr, nc = cc + dc;
          if (nr < 0 || nc < 0 || nr >= SIZE || nc >= SIZE) continue;
          if (board.cells[nr][nc].ship) return false;
        }
      }
    }
    return true;
  }

  function placeShip(board, r, c, size, horiz) {
    const ship = { id: board.ships.length, size, cells: [], hits: 0, sunk: false };
    for (let i = 0; i < size; i++) {
      const rr = r + (horiz ? 0 : i);
      const cc = c + (horiz ? i : 0);
      board.cells[rr][cc].ship = ship;
      ship.cells.push({ r: rr, c: cc });
    }
    board.ships.push(ship);
    return ship;
  }

  function randomFill(board) {
    board.cells.forEach(row => row.forEach(cell => { cell.ship = null; cell.scouted = false; }));
    board.ships = [];
    for (const cfg of SHIP_CONFIG) {
      for (let n = 0; n < cfg.count; n++) {
        let placed = false, tries = 0;
        while (!placed && tries < 3000) {
          const horiz = Math.random() < 0.5;
          const r = Math.floor(Math.random() * SIZE);
          const c = Math.floor(Math.random() * SIZE);
          if (canPlace(board, r, c, cfg.size, horiz)) {
            placeShip(board, r, c, cfg.size, horiz);
            placed = true;
          }
          tries++;
        }
      }
    }
  }

  function buildShipList() {
    const list = [];
    SHIP_CONFIG.forEach(cfg => {
      for (let i = 0; i < cfg.count; i++) list.push(cfg.size);
    });
    return list;
  }

  function shipName(size) {
    return t('ship' + size);
  }

  function getShipShape(ship, r, c) {
    if (ship.size === 1) return 'single';
    const horiz = ship.cells[0].r === ship.cells[1].r;
    const idx = ship.cells.findIndex(sc => sc.r === r && sc.c === c);
    if (horiz) {
      if (idx === 0) return 'h-bow';
      if (idx === ship.size - 1) return 'h-stern';
      return 'h-mid';
    } else {
      if (idx === 0) return 'v-bow';
      if (idx === ship.size - 1) return 'v-stern';
      return 'v-mid';
    }
  }

  function getShapeForSize(size, horiz) {
    const shapes = [];
    if (size === 1) return ['single'];
    for (let i = 0; i < size; i++) {
      let s;
      if (horiz) s = i === 0 ? 'h-bow' : i === size - 1 ? 'h-stern' : 'h-mid';
      else s = i === 0 ? 'v-bow' : i === size - 1 ? 'v-stern' : 'v-mid';
      shapes.push(s);
    }
    return shapes;
  }

  function shoot(board, r, c) {
    const cell = board.cells[r][c];
    if (cell.shot) return null;
    cell.shot = true;

    if (cell.ship) {
      cell.ship.hits++;
      if (cell.ship.hits >= cell.ship.size) {
        cell.ship.sunk = true;
        for (const sc of cell.ship.cells) {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = sc.r + dr, nc = sc.c + dc;
              if (nr < 0 || nc < 0 || nr >= SIZE || nc >= SIZE) continue;
              const ncell = board.cells[nr][nc];
              if (!ncell.shot) { ncell.shot = true; ncell.auto = true; }
            }
          }
        }
        return 'sunk';
      }
      return 'hit';
    }
    return 'miss';
  }

  function buildGrid(gridEl, arr, onClick) {
    gridEl.innerHTML = '';
    arr.length = 0;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const d = document.createElement('div');
        d.className = 'cell';
        d.dataset.r = r;
        d.dataset.c = c;

        d.addEventListener('click', (e) => { e.preventDefault(); onClick(r, c); });

        d.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          if (phase === 'placement') rotate();
        });

        gridEl.appendChild(d);
        arr.push(d);
      }
    }
  }

  function paintBoard(arr, board, showShips) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const el = arr[r * SIZE + c];
        const cell = board.cells[r][c];
        let cls = 'cell';

        if (cell.shot) {
          cls += ' shot';
          if (cell.ship) {
            cls += cell.ship.sunk ? ' sunk' : ' hit';
            cls += ' ship-shape-' + getShipShape(cell.ship, r, c);
          } else {
            cls += cell.auto ? ' auto' : ' miss';
          }
        } else if (showShips && cell.ship) {
          cls += ' ship';
          cls += ' ship-size-' + cell.ship.size;
          cls += ' ship-shape-' + getShipShape(cell.ship, r, c);
        } else if (cell.scouted) {
          cls += ' scouted';
        }

        el.className = cls;
      }
    }
  }

  function getLeftBoard()  { return mode === 'bot' ? boards[0] : boards[activePlayer]; }
  function getRightBoard() { return mode === 'bot' ? boards[1] : boards[1 - activePlayer]; }

  function renderAll() {
    if (phase === 'menu' || !boards.length) return;

    const lb = getLeftBoard();
    const rb = getRightBoard();

    paintBoard(playerCells, lb, true);
    paintBoard(enemyCells, rb, phase === 'over');

    if (phase === 'placement' && previewCells.length) {
      for (const p of previewCells) {
        const el = playerCells[p.r * SIZE + p.c];
        if (!el.classList.contains('ship')) {
          el.classList.add(previewValid ? 'preview-ok' : 'preview-bad');
          if (p.shape) el.classList.add('ship-shape-' + p.shape);
        }
      }
    }

    if (mode === 'bot') {
      leftTitle.textContent = t('yourFleet');
      rightTitle.textContent = t('enemyFleet');
    } else {
      leftTitle.textContent = t('playerField', { n: activePlayer + 1 });
      rightTitle.textContent = t('enemyField', { n: (1 - activePlayer) + 1 });
    }

    const canShoot = phase === 'battle' && !busy && (mode === 'duo' || playerTurn);
    enemyGridEl.classList.toggle('enemy-active', canShoot);

    const canPlace = phase === 'placement';
    playerGridEl.classList.toggle('place-active', canPlace);

    updateScoutButton();
  }

  function renderFleetList() {
    fleetListEl.innerHTML = '';
    shipsToPlace.forEach((size, i) => {
      const chip = document.createElement('div');
      chip.className = 'chip chip-size-' + size;
      if (i === currentShipIdx) chip.classList.add('active');
      if (i < currentShipIdx) chip.classList.add('done');
      for (let k = 0; k < size; k++) {
        const b = document.createElement('span');
        b.className = 'blk';
        chip.appendChild(b);
      }
      fleetListEl.appendChild(chip);
    });
  }

  function renderPlacementInfo() {
    const size = shipsToPlace[currentShipIdx];
    if (size === undefined) return;
    shipSizeLabel.textContent = shipName(size);
    shipsLeftLabel.textContent = shipsToPlace.length - currentShipIdx;

    const badge = document.getElementById('orientationText');
    if (horizontal) {
      orientationBadge.classList.remove('vertical');
      badge.textContent = t('horizontal');
    } else {
      orientationBadge.classList.add('vertical');
      badge.textContent = t('vertical');
    }
  }

  function updateStatus() {
    if (phase === 'menu') { statusEl.textContent = ''; statusEl.className = 'status'; return; }
    if (phase === 'over') return;

    if (phase === 'placement') {
      const left = shipsToPlace.length - currentShipIdx;
      let who = '';
      if (mode === 'duo') who = t('playerPrefix', { n: activePlayer + 1 });
      statusEl.textContent = left > 0
        ? who + t('statusLeft', { n: left })
        : who + t('statusReady');
      statusEl.className = 'status';
      return;
    }

    if (mode === 'bot') {
      statusEl.textContent = playerTurn ? t('statusYourTurn') : t('statusEnemyTurn');
      statusEl.className = 'status ' + (playerTurn ? 'you' : 'enemy');
    } else {
      statusEl.textContent = t('statusTurn', { n: activePlayer + 1 });
      statusEl.className = 'status ' + (activePlayer === 0 ? 'you' : 'enemy');
    }
  }

  function updateScoutButton() {
    if (phase !== 'battle') {
      scoutBtn.style.display = 'none';
      stopScoutTimer();
      return;
    }
    scoutBtn.style.display = '';

    const idx = mode === 'bot' ? 0 : activePlayer;
    const now = Date.now();
    const remain = scoutCooldownEnd[idx] - now;

    if (remain > 0) {
      scoutBtn.disabled = true;
      scoutBtn.classList.add('cooldown');
      scoutBtn.classList.remove('used');
      const sec = Math.ceil(remain / 1000);
      scoutBtn.textContent = t('scoutCooling', { n: sec });
      startScoutTimer();
    } else {
      scoutBtn.disabled = false;
      scoutBtn.classList.remove('cooldown', 'used');
      scoutBtn.textContent = t('scout');
      stopScoutTimer();
    }
  }

  function startScoutTimer() {
    if (scoutTimerId) return;
    scoutTimerId = setInterval(() => {
      if (phase !== 'battle') { stopScoutTimer(); return; }
      updateScoutButton();
    }, 1000);
  }

  function stopScoutTimer() {
    if (scoutTimerId) {
      clearInterval(scoutTimerId);
      scoutTimerId = null;
    }
  }

  function tryScout() {
    if (phase !== 'battle') return;
    const idx = mode === 'bot' ? 0 : activePlayer;
    if (Date.now() < scoutCooldownEnd[idx]) return;

    const targetBoard = mode === 'bot' ? boards[1] : boards[1 - activePlayer];

    let hasCandidates = false;
    for (let r = 0; r < SIZE && !hasCandidates; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = targetBoard.cells[r][c];
        if (cell.ship && !cell.shot && !cell.scouted) { hasCandidates = true; break; }
      }
    }
    if (!hasCandidates) {
      statusEl.textContent = t('scoutNoTarget');
      statusEl.className = 'status scout';
      setTimeout(() => updateStatus(), 1500);
      return;
    }

    scoutBtn.disabled = true;
    scoutBtn.classList.add('cooldown');
    scoutBtn.textContent = t('scoutLoading');

    showRewardedAd(() => {
      doScout(targetBoard);
      scoutCooldownEnd[idx] = Date.now() + SCOUT_COOLDOWN_MS;
      renderAll();
      statusEl.textContent = t('scoutFound');
      statusEl.className = 'status scout';
      setTimeout(() => updateStatus(), 1800);
      if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
    });
  }

  function doScout(board) {
    const candidates = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = board.cells[r][c];
        if (cell.ship && !cell.shot && !cell.scouted) candidates.push({ r, c });
      }
    }
    if (!candidates.length) return;
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    board.cells[pick.r][pick.c].scouted = true;
  }

  function showPass(title, text, callback) {
    passTitle.textContent = title;
    passText.textContent = text;
    passEl.classList.remove('hidden');
    passBtn.onclick = () => { passEl.classList.add('hidden'); callback(); };
  }

  function setPreview(r, c) {
    previewCells = [];
    previewValid = false;
    if (phase !== 'placement') return;
    const size = shipsToPlace[currentShipIdx];
    if (size === undefined) return;

    const shapes = getShapeForSize(size, horizontal);
    const cells = [];
    for (let i = 0; i < size; i++) {
      const rr = r + (horizontal ? 0 : i);
      const cc = c + (horizontal ? i : 0);
      if (rr >= SIZE || cc >= SIZE) { previewCells = []; renderAll(); return; }
      cells.push({ r: rr, c: cc, shape: shapes[i] });
    }
    previewCells = cells;
    const board = getLeftBoard();
    previewValid = canPlace(board, r, c, size, horizontal);
    renderAll();
  }

  function clearPreview() {
    previewCells = [];
    previewValid = false;
    renderAll();
  }

  function handlePlayerClick(r, c) {
    if (phase !== 'placement') return;
    const board = getLeftBoard();
    const size = shipsToPlace[currentShipIdx];
    if (size === undefined) return;

    if (!canPlace(board, r, c, size, horizontal)) {
      previewCells = [];
      previewValid = false;
      const shapes = getShapeForSize(size, horizontal);
      for (let i = 0; i < size; i++) {
        const rr = r + (horizontal ? 0 : i);
        const cc = c + (horizontal ? i : 0);
        if (rr < SIZE && cc < SIZE) previewCells.push({ r: rr, c: cc, shape: shapes[i] });
      }
      renderAll();
      setTimeout(clearPreview, 350);
      if (navigator.vibrate) navigator.vibrate(40);
      return;
    }

    placeShip(board, r, c, size, horizontal);
    currentShipIdx++;
    previewCells = [];

    if (currentShipIdx >= shipsToPlace.length) {
      if (mode === 'bot') {
        phase = 'battle';
        playerTurn = true;
        placementPanel.classList.add('hidden');
        renderAll();
        updateStatus();
        gameplayStart();
      } else {
        if (activePlayer === 0) {
          renderAll();
          updateStatus();
          showPass(
            t('passTitle', { n: 2 }),
            t('passPlacement', { n: 1, n2: 2 }),
            () => {
              activePlayer = 1;
              currentShipIdx = 0;
              shipsToPlace = buildShipList();
              previewCells = [];
              previewValid = false;
              renderFleetList();
              renderPlacementInfo();
              renderAll();
              updateStatus();
            }
          );
        } else {
          phase = 'battle';
          activePlayer = 0;
          placementPanel.classList.add('hidden');
          renderAll();
          updateStatus();
          gameplayStart();
          showPass(
            t('passTitle', { n: 1 }),
            t('passReady', { n: 1 }),
            () => { renderAll(); updateStatus(); }
          );
        }
      }
    } else {
      renderFleetList();
      renderPlacementInfo();
      renderAll();
    }
    updateStatus();
  }

  function rotate() {
    if (phase !== 'placement') return;
    horizontal = !horizontal;
    renderPlacementInfo();
    if (previewCells.length) {
      const last = previewCells[0];
      setPreview(last.r, last.c);
    }
    if (navigator.vibrate) navigator.vibrate(15);
  }

  function handleEnemyClick(r, c) {
    if (phase !== 'battle' || busy) return;
    if (mode === 'bot' && !playerTurn) return;

    const targetBoard = mode === 'bot' ? boards[1] : boards[1 - activePlayer];
    const cell = targetBoard.cells[r][c];
    if (cell.shot) return;

    busy = true;
    const res = shoot(targetBoard, r, c);
    renderAll();

    if (targetBoard.ships.every(s => s.sunk)) { busy = false; endGame(activePlayer); return; }

    if (res === 'miss') {
      if (mode === 'bot') {
        playerTurn = false;
        busy = false;
        renderAll();
        updateStatus();
        setTimeout(aiTurn, 620);
      } else {
        const nextPlayer = 1 - activePlayer;
        busy = false;
        renderAll();
        updateStatus();
        showPass(
          t('passTitle', { n: nextPlayer + 1 }),
          t('passMiss', { n: activePlayer + 1 }),
          () => { activePlayer = nextPlayer; renderAll(); updateStatus(); }
        );
      }
    } else {
      busy = false;
      renderAll();
      updateStatus();
    }
  }

  function aiChooseTarget() {
    const board = boards[0];
    const free = (r, c) => r >= 0 && c >= 0 && r < SIZE && c < SIZE && !board.cells[r][c].shot;

    if (aiHitCells.length) {
      const byRow = {}, byCol = {};
      for (const h of aiHitCells) {
        (byRow[h.r] = byRow[h.r] || []).push(h.c);
        (byCol[h.c] = byCol[h.c] || []).push(h.r);
      }
      for (const key in byRow) {
        const cs = byRow[key].sort((a, b) => a - b);
        if (cs.length >= 2) {
          const r = +key;
          if (free(r, cs[0] - 1)) return { r, c: cs[0] - 1 };
          if (free(r, cs[cs.length - 1] + 1)) return { r, c: cs[cs.length - 1] + 1 };
        }
      }
      for (const key in byCol) {
        const rs = byCol[key].sort((a, b) => a - b);
        if (rs.length >= 2) {
          const c = +key;
          if (free(rs[0] - 1, c)) return { r: rs[0] - 1, c };
          if (free(rs[rs.length - 1] + 1, c)) return { r: rs[rs.length - 1] + 1, c };
        }
      }
      const neighbors = [];
      for (const h of aiHitCells) {
        for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
          const nr = h.r + dr, nc = h.c + dc;
          if (free(nr, nc)) neighbors.push({ r: nr, c: nc });
        }
      }
      if (neighbors.length) return neighbors[Math.floor(Math.random() * neighbors.length)];
    }

    const avail = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!board.cells[r][c].shot) avail.push({ r, c });

    const chebyshev = avail.filter(p => (p.r + p.c) % 2 === 0);
    const pool = chebyshev.length ? chebyshev : avail;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function aiTurn() {
    if (phase !== 'battle' || mode !== 'bot') return;
    busy = true;

    const target = aiChooseTarget();
    if (!target) { busy = false; return; }

    const res = shoot(boards[0], target.r, target.c);

    if (res === 'hit') aiHitCells.push(target);
    else if (res === 'sunk') {
      const ship = boards[0].cells[target.r][target.c].ship;
      aiHitCells = aiHitCells.filter(h => !ship.cells.some(sc => sc.r === h.r && sc.c === h.c));
    }

    renderAll();

    if (boards[0].ships.every(s => s.sunk)) { busy = false; endGame(1); return; }

    if (res === 'miss') {
      playerTurn = true;
      busy = false;
      renderAll();
      updateStatus();
    } else {
      updateStatus();
      setTimeout(aiTurn, 620);
    }
  }

  function endGame(winnerIdx) {
    phase = 'over';
    busy = false;
    gameplayStop();
    stopScoutTimer();

    if (mode === 'bot') {
      const playerWon = winnerIdx === 0;
      statusEl.textContent = playerWon ? t('win') : t('lose');
      statusEl.className = 'status ' + (playerWon ? 'win' : 'lose');
    } else {
      statusEl.textContent = t('playerWin', { n: winnerIdx + 1 });
      statusEl.className = 'status win';
    }

    const rb = getRightBoard();
    paintBoard(enemyCells, rb, true);
    enemyGridEl.classList.remove('enemy-active');
    playerGridEl.classList.remove('place-active');
    scoutBtn.style.display = 'none';

    setTimeout(() => { showFullscreenAd(); }, 1200);
  }

  function startGame(m) {
    mode = m;
    boards = [createBoard(), createBoard()];
    if (m === 'bot') randomFill(boards[1]);

    activePlayer = 0;
    playerTurn = true;
    busy = false;
    shipsToPlace = buildShipList();
    currentShipIdx = 0;
    horizontal = true;
    previewCells = [];
    previewValid = false;
    aiHitCells = [];
    scoutCooldownEnd = [0, 0];
    stopScoutTimer();
    phase = 'placement';

    buildGrid(playerGridEl, playerCells, handlePlayerClick);
    buildGrid(enemyGridEl, enemyCells, handleEnemyClick);

    menuEl.classList.add('hidden');
    passEl.classList.add('hidden');
    placementPanel.classList.remove('hidden');

    renderFleetList();
    renderPlacementInfo();
    renderAll();
    updateStatus();
  }

  function backToMenu() {
    gameplayStop();
    stopScoutTimer();
    phase = 'menu';
    boards = [];
    playerCells = [];
    enemyCells = [];
    playerGridEl.innerHTML = '';
    enemyGridEl.innerHTML = '';
    fleetListEl.innerHTML = '';
    placementPanel.classList.add('hidden');
    passEl.classList.add('hidden');
    menuEl.classList.remove('hidden');
    statusEl.textContent = '';
    statusEl.className = 'status';
    leftTitle.textContent = t('yourFleet');
    rightTitle.textContent = t('enemyFleet');
    scoutBtn.style.display = 'none';
  }

  buildGrid(playerGridEl, playerCells, handlePlayerClick);
  buildGrid(enemyGridEl, enemyCells, handleEnemyClick);

  playerGridEl.addEventListener('mouseover', e => {
    if (phase !== 'placement') return;
    const el = e.target.closest('.cell');
    if (!el) return;
    setPreview(+el.dataset.r, +el.dataset.c);
  });

  playerGridEl.addEventListener('mouseleave', clearPreview);

  rotateBtn.addEventListener('click', rotate);
  newGameBtn.addEventListener('click', backToMenu);
  scoutBtn.addEventListener('click', tryScout);

  randomBtn.addEventListener('click', () => {
    if (phase !== 'placement') return;
    const board = getLeftBoard();
    randomFill(board);
    currentShipIdx = shipsToPlace.length;
    previewCells = [];

    if (mode === 'bot') {
      phase = 'battle';
      playerTurn = true;
      placementPanel.classList.add('hidden');
      renderAll();
      updateStatus();
      gameplayStart();
    } else {
      if (activePlayer === 0) {
        renderAll();
        updateStatus();
        showPass(
          t('passTitle', { n: 2 }),
          t('passPlacement', { n: 1, n2: 2 }),
          () => {
            activePlayer = 1;
            currentShipIdx = 0;
            shipsToPlace = buildShipList();
            previewCells = [];
            previewValid = false;
            renderFleetList();
            renderPlacementInfo();
            renderAll();
            updateStatus();
          }
        );
      } else {
        phase = 'battle';
        activePlayer = 0;
        placementPanel.classList.add('hidden');
        renderAll();
        updateStatus();
        gameplayStart();
        showPass(
          t('passTitle', { n: 1 }),
          t('passReady', { n: 1 }),
          () => { renderAll(); updateStatus(); }
        );
      }
    }
  });

  clearBtn.addEventListener('click', () => {
    if (phase !== 'placement') return;
    const board = getLeftBoard();
    board.cells.forEach(row => row.forEach(cell => { cell.ship = null; }));
    board.ships = [];
    currentShipIdx = 0;
    previewCells = [];
    renderAll();
    renderFleetList();
    renderPlacementInfo();
    updateStatus();
  });

  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'r' || k === 'к') { e.preventDefault(); rotate(); }
  });

  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) gameplayStop();
    else if (phase === 'battle') gameplayStart();
  });

  // Стартуем — сначала применяем язык браузера
  applyTranslations();
  backToMenu();

  // Запуск SDK (асинхронно перезапишет язык, если Яндекс ответит)
  initYandexSDK();
})();
</script>
</body>
